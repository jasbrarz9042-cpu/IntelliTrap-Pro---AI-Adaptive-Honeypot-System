<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Employee Portal | IntelliTrap Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="honeypot-body">
    <div class="security-banner">
        <span class="pulse-dot"></span>
        SECURITY MONITORING ACTIVE - UNAUTHORIZED ACCESS WILL BE LOGGED
    </div>

    <div class="background-elements">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
        <div class="cyber-grid"></div>
    </div>
    
    <div class="login-container">
        <div class="login-header">
            <div class="logo-placeholder">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="url(#paint0_linear)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M2 17L12 22L22 17" stroke="url(#paint1_linear)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M2 12L12 17L22 12" stroke="url(#paint2_linear)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <defs>
                        <linearGradient id="paint0_linear" x1="2" y1="7" x2="22" y2="7" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#3B82F6"/>
                            <stop offset="1" stop-color="#8B5CF6"/>
                        </linearGradient>
                        <linearGradient id="paint1_linear" x1="2" y1="19.5" x2="22" y2="19.5" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#3B82F6"/>
                            <stop offset="1" stop-color="#8B5CF6"/>
                        </linearGradient>
                        <linearGradient id="paint2_linear" x1="2" y1="14.5" x2="22" y2="14.5" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#3B82F6"/>
                            <stop offset="1" stop-color="#8B5CF6"/>
                        </linearGradient>
                    </defs>
                </svg>
            </div>
            <h1>Confidential Access System</h1>
            <p>Secure Employee Portal. Please sign in.</p>
        </div>

        <!-- Fake Error Message Container -->
        <div id="login-error" class="login-error hidden">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
            <span>Authentication Failed. Invalid Credentials.</span>
        </div>

        <form id="honeypot-form" action="/login" method="POST" class="login-form">
            <div class="input-group">
                <label for="username">Corporate ID / Username</label>
                <div class="input-wrapper">
                    <input type="text" id="username" name="username" placeholder="Enter your ID" required autocomplete="username">
                    <div class="input-focus-border"></div>
                </div>
            </div>

            <div class="input-group">
                <label for="password">Security Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                    <div class="input-focus-border"></div>
                </div>
            </div>

            <div class="form-actions">
                <label class="remember-me">
                    <input type="checkbox" name="remember">
                    <span class="checkmark"></span>
                    Remember device
                </label>
                <a href="#" class="forgot-password">Forgot access key?</a>
            </div>

            <button type="submit" class="submit-btn" id="submit-btn">
                <span id="btn-text">Establish Secure Connection</span>
                <svg id="btn-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M5 12H19M19 12L12 5M19 12L12 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <div id="btn-loader" class="loader hidden"></div>
            </button>
        </form>
    </div>

    <!-- Fake Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay hidden">
        <div class="cyber-spinner"></div>
        <div class="loading-text" id="loading-text">Encrypting credentials...</div>
    </div>

    <script src="{{ url_for('static', filename='login.js') }}"></script>
</body>
</html>
